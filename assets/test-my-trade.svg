  <rect x="680" y="58" width="458" height="272" rx="12" fill="#0F151C" stroke="#1F2937"/>
  <text x="710" y="91" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" fill="#7D8590">SIMULATION / PRICE TAPE</text>
  <text x="1106" y="91" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" fill="#00E58A">SAMPLE RUN</text>
