<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-label="Test My Trade: build and evaluate trading strategies with synthetic or personal price data">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#141B24"/>
    </pattern>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00E58A" stop-opacity=".16"/>
      <stop offset="1" stop-color="#00E58A" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x=".5" y=".5" width="1199" height="389" rx="12" fill="#0B0F14" stroke="#1F2937"/>
  <rect x="1" y="1" width="1198" height="388" rx="12" fill="url(#grid)"/>
  <circle cx="850" cy="170" r="290" fill="url(#glow)"/>
  <text x="54" y="55" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" fill="#F5B83D" letter-spacing="2">$ ./test-my-trade</text>
  <text x="54" y="126" font-family="Segoe UI,-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="48" font-weight="800" fill="#E6EDF3">Test My Trade</text>
  <text x="56" y="170" font-family="Segoe UI,-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="19" fill="#00E58A">Build a strategy. Test it before risking capital.</text>
  <text x="56" y="218" font-family="Segoe UI,-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="16" fill="#AAB4C0">Practice for the Indian market with synthetic prices</text>
  <text x="56" y="244" font-family="Segoe UI,-apple-system,BlinkMacSystemFont,Arial,sans-serif" font-size="16" fill="#AAB4C0">or your own market data, then review a plain-language report.</text>
