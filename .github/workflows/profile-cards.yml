name: Refresh profile cards

on:
  schedule:
    - cron: "17 21 * * *"   # daily, ~02:47 IST
  workflow_dispatch:         # run it by hand from the Actions tab
  push:
    branches: [main]
    paths:
      - "scripts/cards.mjs"
      - ".github/workflows/profile-cards.yml"

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate SVG cards
        env:
          GH_TOKEN: ${{ secrets.CARDS_TOKEN || secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
          PINS: "Cp_Algorithms,seed_bank,E_commerce,Github_issue_scraper"
        run: node scripts/cards.mjs

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated
          git diff --cached --quiet || git commit -m "chore: refresh profile cards"
          git push
